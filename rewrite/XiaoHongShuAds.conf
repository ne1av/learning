// ==UserScript==
// @ScriptName        小红书净化+功能增强[墨鱼版-rnote兼容]
// @Author            @ddgksf2013, rnote compatibility update by ne1av
// @MainFunction      去除开屏、瀑布流及启动服务广告，屏蔽隐私与青少年请求，去除帖子图片水印、Live 图片水印及短视频水印，功能增强与体验优化
// @UpdateTime        2026-08-05
// @Attention         请在 Quantumult X 配置文件的 [general] 下添加 udp_drop_list=443
// @ScriptURL         https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/rewrite/XiaoHongShuAds.conf
// ==/UserScript==

hostname = *.xiaohongshu.com, *.rnote.com

# > 首页瀑布流广告，兼容 xiaohongshu.com 与 rnote.com
^https?:\/\/(?:[a-z0-9-]+\.)?(?:xiaohongshu\.com|rnote\.com)\/api\/sns\/v\d+\/homefeed(?:\?|$) url script-response-body https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/scripts/redbook.ads.js

# > 搜索广告推荐
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/api\/sns\/v\d+\/search\/notes\/recommend_info(?:\?|$) url reject-200

# > 内容、保存及去水印，兼容新旧 API 域名
^https?:\/\/[a-z0-9-]+\.(?:xiaohongshu\.com|rnote\.com)\/api\/sns\/v\d+\/note\/(?:tabfeed|video\/save|live_photo\/save|widgets|redtube|videofeed|feed|imagefeed)(?:\?|$) url script-response-body https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/scripts/redbook.ads.js

# > 搜索结果及搜索服务
^https?:\/\/[a-z0-9-]+\.(?:xiaohongshu\.com|rnote\.com)\/api\/sns\/v\d+\/search\/(?:notes|hot_list|hint|trending)(?:\?|$) url script-response-body https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/scripts/redbook.ads.js

# > 首页分类
^https?:\/\/[a-z0-9-]+\.(?:xiaohongshu\.com|rnote\.com)\/api\/sns\/v\d+\/homefeed\/categories(?:\?|$) url script-response-body https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/scripts/redbook.ads.js

# > 系统配置
^https?:\/\/[a-z0-9-]+\.(?:xiaohongshu\.com|rnote\.com)\/api\/sns\/v\d+\/system_service\/(?:splash_config|config)(?:\?|$) url script-response-body https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/scripts/redbook.ads.js

# > 开屏及广告接口
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/api\/sns\/v\d+\/system_service\/splash(?:\?|$) url reject-200
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/api\/(?:gslb|httpdns)(?:\?|$) url reject-200
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/api\/sns\/v\d+\/(?:tag\/)?ads(?:\/|\?|$) url reject-200

# > 隐私、开关、青少年与启动引导
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/v\d+\/stateReport(?:\?|$) url reject-200
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/data\/native\/matrix_switches(?:\?|$) url reject-200
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/api\/sns\/v\d+\/user\/teenager\/status(?:\?|$) url reject-200
^https?:\/\/[a-z0-9-]+\.xiaohongshu\.com\/api\/sns\/v\d+\/guide\/home_guide(?:\?|$) url reject-200

# > 评论区图片处理，按需取消行首分号启用
;^https?:\/\/[a-z0-9-]+\.(?:xiaohongshu\.com|rnote\.com)\/api\/sns\/v\d+\/note\/comment\/list(?:\?|$) url script-response-body https://raw.githubusercontent.com/ne1av/learning/refs/heads/main/scripts/redbook.ads.js
